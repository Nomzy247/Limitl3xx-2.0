<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0052ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PoolMining" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0a0e17" />
    <meta name="msapplication-tap-highlight" content="no" />
    <script>
      const path = window.location.pathname;
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      
      if (path.startsWith('/integration/e-payment')) {
        manifestLink.href = '/epayment-manifest.json';
        document.title = 'E-Payment Gateway';
      } else {
        manifestLink.href = '/manifest.json';
      }
      
      document.head.appendChild(manifestLink);
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PoolMining" />
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/poolmining192/192/192" />
    <title>PoolMining.cloud | Automated Wealth Generation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
